# De bouwketen staat in package.json ("bouw" en "deploy"), niet hier.
#
# Tot 2026-07-28 stond hij hier voluit, en daarnaast wilde ik hem ook lokaal kunnen draaien
# voor npm run pdf. Dat zou een tweede exemplaar van dezelfde lijst hebben opgeleverd — de
# fout die deze week zes keer terugkwam, in het commando dat hem moest oplossen. Eén
# definitie, twee aanroepers: Netlify draait "deploy", lokaal draai je "bouw".
[build]
  publish = "publiek"
  functions = "netlify/functions"
  # publish = "publiek": alleen wat build-publiek daar bewust neerzet is publiek. Stond
  # op "." — toen werd ALLES geserveerd (api.json/site.json lekten zo op 2026-07-25, en
  # whitepapers/_*.json met interne velden waren opvraagbaar). Een inclusielijst faalt de
  # goede kant op: een vergeten pagina is zichtbaar weg, een vergeten uitsluiting lekte stil.
  #
  # Register-sync + publicatiepoort. De sync valt terug op de meegecommitte
  # projectie als Supabase onbereikbaar is (exit 0), zodat een storing daar geen
  # deploy hier blokkeert. De poort faalt wél hard: een pagina mag nooit een claim
  # tonen die het register niet vrijgeeft. Sabotage-test: verify-bronnen --saboteer.
  command = "npm run deploy"

[build.environment]
  NODE_VERSION = "20"

# ── Nette URL voor de whitepaper-opt-in-bevestiging ──
# Staat in de bevestigingsmail; leest prettiger dan /.netlify/functions/...
[[redirects]]
  from = "/whitepapers/bevestig"
  to = "/.netlify/functions/whitepaper-confirm"
  status = 200

[[redirects]]
  from = "/api/beheer"
  to = "/.netlify/functions/beheer"
  status = 200

[[redirects]]
  from = "/api/kennisproef"
  to = "/.netlify/functions/kennisproef"
  status = 200

[[redirects]]
  from = "/api/meet-signaal"
  to = "/.netlify/functions/meet-signaal"
  status = 200

[[redirects]]
  from = "/api/scan-result"
  to = "/.netlify/functions/scan-result"
  status = 200

# Korte campagnelink; de volledige naam blijft de canonical.
[[redirects]]
  from = "/scan/"
  to = "/kennisgezagsscan/"
  status = 301
  force = true

# Canonieke whitepaper-URL's zijn extensionless. De eerste regel maakt oude
# gedeelde URL's permanent canoniek; de tweede serveert het bestaande bestand.
[[redirects]]
  from = "/whitepapers/de-beste-keuze-is.html"
  to = "/whitepapers/de-beste-keuze-is"
  status = 301
  force = true
[[redirects]]
  from = "/whitepapers/de-klinkklare-onzin.html"
  to = "/whitepapers/de-klinkklare-onzin"
  status = 301
  force = true
[[redirects]]
  from = "/whitepapers/de-mens-beslist.html"
  to = "/whitepapers/de-mens-beslist"
  status = 301
  force = true
[[redirects]]
  from = "/whitepapers/wie-heeft-de-sleutels.html"
  to = "/whitepapers/wie-heeft-de-sleutels"
  status = 301
  force = true

[[redirects]]
  from = "/whitepapers/de-beste-keuze-is"
  to = "/whitepapers/de-beste-keuze-is.html"
  status = 200
[[redirects]]
  from = "/whitepapers/de-klinkklare-onzin"
  to = "/whitepapers/de-klinkklare-onzin.html"
  status = 200
[[redirects]]
  from = "/whitepapers/de-mens-beslist"
