# ── Globale security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# ── Cache static media (afbeeldingen, video, SVG's) ──
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/werk/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Demo-oppervlakken zijn gecontroleerde previews, geen publieke R.O.B.-pagina's.
# De HTML draagt dezelfde grens; de header borgt hem ook voor bots die meta-tags missen.
[[headers]]
  for = "/demo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

# De post stond twintig minuten live op een adres dat niet bij zijn titel paste.
# Kort, maar hij stond al in de sitemap en de feed — dus een 301 en geen stilte.
[[redirects]]
  from = "/nieuws/niet-te-weinig-weten/"
  to = "/nieuws/het-probleem-is-niet-te-weinig-weten/"
  status = 301
  force = true
