[build]
  publish = "publiek"
  functions = "netlify/functions"
  # publish = "publiek": alleen wat build-publiek daar bewust neerzet is publiek. Stond
  # op "." — toen werd ALLES geserveerd (api.json/site.json lekten zo op 2026-07-25, en
  # whitepapers/_*.json met interne velden waren opvraagbaar). Een inclusielijst faalt de
  # goede kant op: een vergeten pagina is zichtbaar weg, een vergeten uitsluiting lekte stil.
  #
  # Register-sync + publicatiepoort. De sync valt terug op de meegecommitte
  # projectie als Supabase onbereikbaar is (exit 0), zodat een storing daar geen
  # deploy hier blokkeert. De poort faalt wél hard: een pagina mag nooit een claim
  # tonen die het register niet vrijgeeft. Sabotage-test: verify-bronnen --saboteer.
  command = "node tools/sync-register.mjs && node tools/sync-berichten.mjs && node tools/build-doors.mjs && node tools/build-vragen.mjs && node tools/build-nieuws.mjs && node tools/verify-bronnen.mjs && node tools/verify-nagetrokken.mjs && node tools/verify-lagen.mjs && node tools/build-publiek.mjs && node tools/build-entiteiten.mjs && node tools/build-llms.mjs && node tools/build-bewijs.mjs && node tools/build-bewijs-pagina.mjs && node tools/build-sitemap.mjs && node tools/verify-publiek.mjs && node tools/build-site-kennis.mjs && node tools/verify-agent-kennis.mjs && node tools/build-promptfoo-prompt.mjs && node tools/verify-promptfoo.mjs"

[build.environment]
  NODE_VERSION = "20"

# ── Nette URL voor de whitepaper-opt-in-bevestiging ──
# Staat in de bevestigingsmail; leest prettiger dan /.netlify/functions/...
[[redirects]]
  from = "/whitepapers/bevestig"
  to = "/.netlify/functions/whitepaper-confirm"
  status = 200

# ── Globale security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# ── Cache static media (afbeeldingen, video, SVG's) ──
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/werk/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
