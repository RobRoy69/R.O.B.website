<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kennisproef — R.O.B. Concepting</title><meta name="description" content="Inspecteer hoe bruikbaar één publieke webpagina is als kennisbron."><link rel="canonical" href="https://rob-concepting.com/kennisproef/"><style>:root{--ink:#001a4d;--cyan:#0fa8cb;--paper:#f4f2ed;--cream:#e8e4dc}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 Arial,sans-serif}main{max-width:820px;margin:auto;padding:48px 22px}h1{font-size:clamp(34px,7vw,62px);line-height:1}.card{background:var(--paper);padding:24px;margin:20px 0;border-left:3px solid var(--cyan)}input{width:100%;padding:13px;margin:10px 0;font:inherit}button{border:0;background:var(--ink);color:white;padding:13px 20px;font-weight:700}li{margin:12px 0}</style></head><body><main><p><a href="/">← R.O.B. Concepting</a></p><h1>Wat kan een systeem verantwoord uit deze pagina halen?</h1><p>Deze proef beoordeelt kennisgereedheid, niet waarheid. Er wordt één publiek toegankelijke webpagina tijdelijk gelezen en niet als canon opgeslagen.</p><form class="card" id="proef"><label for="url">Publieke pagina</label><input id="url" name="url" type="url" required placeholder="https://voorbeeld.nl/pagina"><button>Voer de kennisproef uit</button></form><section id="uitkomst" class="card" hidden aria-live="polite"></section></main><script>document.querySelector('#proef').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#uitkomst');out.hidden=false;out.textContent='De pagina wordt veilig gelezen…';try{const r=await fetch('/api/kennisproef',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:new FormData(e.target).get('url')})});const d=await r.json();if(!r.ok)throw new Error(d.error||'De proef kon niet worden uitgevoerd.');out.innerHTML=`<h2>${d.title||'Pagina'}</h2><p>${d.summary}</p><ol>${d.findings.map(x=>`<li><strong>${x.label}:</strong> ${x.explanation}</li>`).join('')}</ol>`}catch(err){out.textContent=err.message}});</script></body></html>
