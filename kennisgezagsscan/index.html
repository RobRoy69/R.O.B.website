<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kennisgezagsscan — R.O.B. Concepting</title><meta name="description" content="Ontdek in vijf minuten welke sleutel van je organisatiekennis het kwetsbaarst is.">
<link rel="canonical" href="https://rob-concepting.com/kennisgezagsscan/"><style>
:root{--ink:#001a4d;--cyan:#0fa8cb;--red:#e8391e;--paper:#f4f2ed;--cream:#e8e4dc}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 Arial,sans-serif}main{max-width:820px;margin:auto;padding:48px 22px}h1{font-size:clamp(34px,7vw,62px);line-height:1}.lead{font-size:20px}.card{background:var(--paper);padding:24px;margin:18px 0;border-left:3px solid var(--cyan)}fieldset{border:0;padding:0;margin:0}legend{font-weight:700;margin-bottom:12px}.opts{display:flex;gap:10px;flex-wrap:wrap}label{border:1px solid #a9a39b;padding:8px 14px;cursor:pointer}button,a.knop{display:inline-block;border:0;background:var(--ink);color:white;padding:13px 20px;text-decoration:none;font-weight:700;cursor:pointer}#resultaat{border-left-color:var(--red)}small{display:block;color:#5e5a63;margin:12px 0}</style></head><body><main>
<p><a href="/">← R.O.B. Concepting</a></p><h1>Welke sleutel is het kwetsbaarst?</h1><p class="lead">Twaalf concrete vragen. Geen account, geen automatische opslag en geen nieuwsbrief.</p>
<form id="scan"></form><section id="resultaat" class="card" hidden aria-live="polite"></section></main><script type="module">
const score={nee:0,gedeeltelijk:1,ja:2};const advies={Aanbeveelbaarheid:'Maak eerst expliciet waarop klanten en systemen je verantwoord kunnen aanbevelen.',Stem:'Leg vast wat een AI namens je organisatie mag zeggen en waar hij moet stoppen.',Beslisrecht:'Wijs echte beslissers aan die mogen afwijken en de gevolgen dragen.',Kennisgezag:'Geef kernkennis een eigenaar, bron, controledatum en intrekroute.'};
const data=await fetch('./vragen.json').then(r=>r.json());const form=document.querySelector('#scan');data.vragen.forEach((v,i)=>{const d=document.createElement('fieldset');d.className='card';d.innerHTML=`<legend>${i+1}. ${v.tekst}</legend><div class="opts">${data.schaal.map(x=>`<label><input required type="radio" name="q${i}" value="${x}"> ${x}</label>`).join('')}</div>`;form.append(d)});form.insertAdjacentHTML('beforeend','<small>Je antwoorden blijven in deze browser en worden niet verzonden.</small><button>Toon mijn uitkomst</button>');form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form),tot={};data.vragen.forEach((v,i)=>tot[v.sleutel]=(tot[v.sleutel]||0)+score[fd.get(`q${i}`)]);const zwak=Object.entries(tot).sort((a,b)=>a[1]-b[1])[0];const max=6;const profiel=zwak[1]<=2?'onbeheerd':zwak[1]<=4?'kwetsbaar':'in opbouw';const out=document.querySelector('#resultaat');out.hidden=false;out.innerHTML=`<h2>Profiel: ${profiel}</h2><p>Je zwakste sleutel is <strong>${zwak[0]}</strong> (${zwak[1]} van ${max}). ${advies[zwak[0]]}</p><p><a class="knop" href="/#contact">Bespreek de eerste bouwstap</a></p>`;out.scrollIntoView({behavior:'smooth'});});
</script></body></html>
